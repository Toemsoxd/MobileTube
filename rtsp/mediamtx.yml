# MobileTube RTSP server.
# A request for rtsp://HOST:8554/<youtube-video-id> starts FFmpeg on demand.
# FFmpeg resolves the video through the configured Invidious API and emits
# legacy-friendly 240p H.263 + AMR-NB for Windows Mobile Streaming Media.

rtsp: true
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: :8554

paths:
  ~^/[A-Za-z0-9_-]{6,20}$:
    runOnDemand: python3 server/stream_youtube.py $MTX_PATH
    runOnDemandRestart: yes
