# MobileTube RTSP server.
#
# The web frontend can stay on a static host. MediaMTX and FFmpeg run on a
# separate VPS/machine and create each YouTube stream only when requested.
#
# A client opens:
#   rtsp://YOUR-SERVER:8554/yt-VIDEO_ID
#
# The stream helper resolves VIDEO_ID through Invidious and transcodes it to
# a legacy-friendly 240p H.263 + AMR-NB RTSP stream.

rtsp: true
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: :8554

paths:
  "~^yt-[A-Za-z0-9_-]{11}$":
    runOnDemand: python3 tools/stream_youtube.py
    runOnDemandRestart: no
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 10s
