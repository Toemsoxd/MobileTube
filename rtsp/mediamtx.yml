# MobileTube RTSP test server configuration.
#
# Run MediaMTX from the repository root so the relative media path resolves.
# KESUG hosts the web frontend; the RTSP daemon runs on a separate server/VPS.

rtsp: true
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: :8554

paths:
  super-mario-bros-in-first-person:
    runOnDemand: ffmpeg -re -i "vids/Super+Mario+Bros+in+First+Person.3gp" -c copy -f rtsp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
